# HTTP routing example only. Configure domain and HTTPS before public use.
server {
    listen 80;
    server_name _;
    root /opt/gr6/front_end_candidate;
    index index.html;
    client_max_body_size 6m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /employer { return 302 /employer/jobs; }
    location = /admin { return 302 /admin/jobs; }
    location ^~ /employer/ {
        root /opt/gr6/front_end/dist;
        try_files $uri /workspace-index.html;
    }
    location ^~ /admin/ {
        root /opt/gr6/front_end/dist;
        try_files $uri /workspace-index.html;
    }
    location = /workspace-index.html {
        internal;
        alias /opt/gr6/front_end/dist/index.html;
    }
    location ^~ /assets/ {
        root /opt/gr6/front_end/dist;
        try_files $uri =404;
    }
    location = /candidate/profile { return 302 /pages/profile.html; }
    location = /candidate/applications { return 302 /pages/applications.html; }
    location ~ /\. { deny all; }
    location ~* \.md$ { deny all; }
    location / { try_files $uri $uri/ =404; }
}
